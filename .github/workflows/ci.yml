name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: bitchat-proto + bitchatd (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked

  model:
    name: Model.js (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - run: jq empty manifest.json
      - run: bash -n dist/install.sh && bash -n dist/uninstall.sh

  install:
    name: install.sh / uninstall.sh (sandboxed HOME, stubbed systemctl)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gen-known-hashes.sh --check walks main and the tags
      - run: for f in dist/*.sh tests/install/*.sh tests/install/cases/*.sh tests/install/stubs/*; do bash -n "$f" || exit 1; done
      # This checkout's unit is listed, and every listed hash is one a fresh
      # generation produces (so a hand-added hash fails).
      - run: dist/gen-known-hashes.sh --check
      - run: bash tests/install/run.sh
